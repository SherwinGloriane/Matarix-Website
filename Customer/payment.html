<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MATARIX - Order Payment</title>
    <!-- Google Fonts - Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 4 CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="../Customer_assets/css/payment.css" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <nav class="navbar navbar-expand-lg matarix-header">
        <div class="container-fluid">
            <!-- Mobile menu toggle button -->
            <button class="navbar-toggler d-lg-none" type="button" id="sidebarToggle">
                <i class="fas fa-bars text-white"></i>
            </button>
            <!-- LOGO -->
            <a class="navbar-brand" href="MainPage.html">
                <img src="../Customer_assets/images/LOGO.png" alt="MATARIX Logo" height="50" class="logo-img d-none d-md-inline">
                <span class="d-md-none">MATARIX</span>
            </a>
            
            <!-- HEADER ICONS -->
            <div class="ml-auto header-icons">
                <a href="#" class="navbar-icons" title="Notifications (Coming Soon)">
                    <i class="fas fa-bell"></i>
                </a>
                <a href="Cart.html" class="navbar-icons" title="Shopping Cart">
                    <i class="fas fa-shopping-cart"></i>
                </a>
                <a href="CustomerProfile.html" class="navbar-icons" title="My Profile">
                    <i class="fas fa-user"></i>
                </a>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- SIDEBAR NAVIGATION -->
            <div class="sidebar" id="sidebar">
                <div class="sidebar-overlay d-lg-none" id="sidebarOverlay"></div>
                <div class="sidebar-content">
                    <a href="MainPage.html" class="sidebar-item">
                        <i class="fas fa-cubes"></i>Materials
                    </a>
                    <a href="OrderSummary.html" class="sidebar-item active">
                        <i class="fas fa-box"></i>Orders
                    </a>
                    <a href="delivery-tracking.html" class="sidebar-item">
                        <i class="fas fa-truck"></i>Deliveries
                    </a>
                    
                </div>
            </div>

            <!-- MAIN CONTENT AREA -->
            <div class="main-content">
                <!-- Order Payment Page -->
                <div class="page-header">
                    <h1 class="page-title">Order Payment</h1>
                </div>

                <!-- Progress Tracker will be auto-generated by navigation.js here -->

                <!-- Payment Notice -->
                <div class="payment-notice">
                    <i class="fas fa-exclamation-triangle"></i>
                    <div class="payment-notice-text">
                        Payment Required: Please complete your payment to continue order processing.
                    </div>
                </div>

                <!-- Order Card - Clickable to expand -->
                <div class="order-card" id="orderCard" onclick="toggleOrderDetails()">
                    <div class="order-item">
                        <div class="item-image">🔩</div>
                        <div class="item-details">
                            <div class="item-name">Loading order...</div>
                            <div class="item-description">Please wait...</div>
                        </div>
                        <div class="order-actions">
                            <i class="fas fa-receipt" style="color: var(--matarix-red-light); font-size: 1.5rem;"></i>
                            <i class="fas fa-chevron-right expand-icon"></i>
                        </div>
                    </div>
                    
                    <!-- Expanded Order Details - Will be loaded dynamically -->
                    <div class="order-details">
                        <!-- Order details will be loaded here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Sidebar toggle functionality
        document.getElementById('sidebarToggle').addEventListener('click', function() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('show');
            overlay.classList.toggle('show');
        });

        // Close sidebar when clicking overlay
        document.getElementById('sidebarOverlay').addEventListener('click', function() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.remove('show');
            overlay.classList.remove('show');
        });

        function toggleOrderDetails() {
            const orderCard = document.getElementById('orderCard');
            orderCard.classList.toggle('expanded');
        }

        function selectPayment(element, event) {
            event.stopPropagation(); // Prevent card toggle
            
            // Remove selected class from all options
            document.querySelectorAll('.payment-option').forEach(option => {
                option.classList.remove('selected');
            });
            
            // Add selected class to clicked option
            element.classList.add('selected');
            
            // Check the radio button
            const radio = element.querySelector('input[type="radio"]');
            radio.checked = true;
        }

        // Close sidebar when clicking outside on mobile
        document.addEventListener('click', function(event) {
            const sidebar = document.getElementById('sidebar');
            const toggle = document.getElementById('sidebarToggle');
            
            if (!sidebar.contains(event.target) && !toggle.contains(event.target)) {
                sidebar.classList.remove('show');
                document.getElementById('sidebarOverlay').classList.remove('show');
            }
        });
    </script>
    
    <!-- Customer Authentication Check - MUST load first to verify session -->
    <script src="../Customer_assets/js/customer_auth_check.js"></script>
    
    <!-- URL Authentication Helper - MUST load to preserve user_id in URLs -->
    <script src="../Customer_assets/js/url_auth_helper.js"></script>
    
    <!-- Load Payment Order -->
    <script src="../Customer_assets/js/load_payment.js"></script>
    
    <!-- MATARIX NAVIGATION SYSTEM -->
    <script src="../Customer_assets/js/navigation.js"></script>
</body>
</html>
