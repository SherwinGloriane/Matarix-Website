<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MATARIX - Delivery Tracking</title>
    <!-- Google Fonts - Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 4 CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="../Customer_assets/css/delivery-tracking.css" rel="stylesheet">
    <!-- Calendar Scheduler CSS -->
    <link href="../Customer_assets/css/calendar-scheduler.css" rel="stylesheet">
    <!-- Customer Notifications CSS -->
    <link href="../Customer_assets/css/customer-notifications.css" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <nav class="navbar navbar-expand-lg matarix-header">
        <div class="container-fluid">
            <!-- Mobile menu toggle button -->
            <button class="navbar-toggler d-lg-none" type="button" id="sidebarToggle">
                <i class="fas fa-bars text-white"></i>
            </button>
            <!-- LOGO -->
            <a class="navbar-brand" href="MainPage.html">
                <img src="../Customer_assets/images/LOGO.png" alt="MATARIX Logo" height="50" class="logo-img d-none d-md-inline">
                <span class="d-md-none">MATARIX</span>
            </a>
            
            <!-- HEADER ICONS -->
            <div class="ml-auto header-icons">
                <a href="#" class="navbar-icons" id="customerNotificationsBtn" title="Notifications" style="position: relative;">
                    <i class="fas fa-bell"></i>
                    <span class="notification-badge" id="customerNotificationBadge" style="display: none;">0</span>
                </a>
                <a href="Cart.html" class="navbar-icons" title="Shopping Cart">
                    <i class="fas fa-shopping-cart"></i>
                </a>
                <a href="CustomerProfile.html" class="navbar-icons" title="My Profile">
                    <i class="fas fa-user"></i>
                </a>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- SIDEBAR NAVIGATION -->
            <div class="sidebar" id="sidebar">
                <div class="sidebar-overlay d-lg-none" id="sidebarOverlay"></div>
                <div class="sidebar-content">
                    <a href="#" class="sidebar-item" id="materialsLink">
                        <i class="fas fa-cubes"></i>Materials
                    </a>
                    <a href="OrderSummary.html" class="sidebar-item">
                        <i class="fas fa-box"></i>Orders
                    </a>
                    <a href="delivery-tracking.html" class="sidebar-item active">
                        <i class="fas fa-truck"></i>Deliveries
                    </a>
                </div>
            </div>

            <!-- MAIN CONTENT AREA -->
            <div class="main-content">
                <!-- Delivery Tracking Page -->
                <div class="page-header">
                    <h1 class="page-title">Delivery Tracking</h1>
                </div>

                <!-- Progress Tracker will be auto-generated by navigation.js -->

                <!-- Orders List Section -->
                <div class="orders-list-section" id="ordersListSection">
                    <div class="section-header">
                        <h2 class="section-title">My Orders</h2>
                        <p class="section-subtitle">Select an order to track its delivery</p>
                    </div>
                    
                    <!-- Filters -->
                    <div class="orders-filters" id="ordersFilters">
                        <div class="filter-group">
                            <label for="statusFilter" class="filter-label">
                                <i class="fas fa-filter"></i> Filter by Status
                            </label>
                            <select id="statusFilter" class="filter-select" onchange="applyFilters()">
                                <option value="all">All Statuses</option>
                                <option value="Pending">Pending</option>
                                <option value="Preparing">Preparing</option>
                                <option value="Out for Delivery">Out for Delivery</option>
                                <option value="Delivered">Delivered</option>
                                <option value="Cancelled">Cancelled</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label for="sortFilter" class="filter-label">
                                <i class="fas fa-sort"></i> Sort by
                            </label>
                            <select id="sortFilter" class="filter-select" onchange="applyFilters()">
                                <option value="date-desc">Newest First</option>
                                <option value="date-asc">Oldest First</option>
                                <option value="amount-desc">Highest Amount</option>
                                <option value="amount-asc">Lowest Amount</option>
                                <option value="status">Status</option>
                            </select>
                        </div>
                        <button class="btn-clear-filters" onclick="clearFilters()" id="clearFiltersBtn" style="display: none;">
                            <i class="fas fa-times"></i> Clear Filters
                        </button>
                    </div>
                    
                    <div class="orders-list" id="ordersList">
                        <div class="text-center py-4">
                            <p class="text-muted">Loading orders...</p>
                        </div>
                    </div>
                    
                    <!-- Results count -->
                    <div class="results-info" id="resultsInfo" style="display: none;">
                        <p class="results-text">
                            Showing <span id="resultsCount">0</span> of <span id="totalCount">0</span> orders
                        </p>
                    </div>
                </div>

                <!-- Selected Order Tracking Section -->
                <div class="selected-order-section" id="selectedOrderSection" style="display: none;">
                    <div class="section-header">
                        <button class="btn-back" onclick="showOrdersList(event)" data-nav-handled="true">
                            <i class="fas fa-arrow-left"></i> Back to Deliveries
                        </button>
                        <h2 class="section-title">Delivery Tracking</h2>
                    </div>

                    <!-- Order Summary Card - Starts collapsed -->
                    <div class="order-card" id="orderCard" onclick="toggleOrderDetails()">
                        <div class="order-item">
                            <div class="item-image">📦</div>
                            <div class="item-details">
                                <div class="item-name">Loading order...</div>
                                <div class="item-description">Please wait...</div>
                            </div>
                            <div class="order-actions">
                                <i class="fas fa-truck" style="color: var(--matarix-red-light); font-size: 1.5rem;"></i>
                                <i class="fas fa-chevron-right expand-icon"></i>
                            </div>
                        </div>
                    </div>

                    <!-- EXPANDABLE CONTENT - Hidden by default, will be loaded dynamically -->
                    <div class="expandable-content" id="expandableContent">
                        <!-- Content will be loaded here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 4 JS and dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Customer Authentication Check - MUST load first to verify session -->
    <script src="../Customer_assets/js/customer_auth_check.js"></script>
    
    <!-- URL Authentication Helper - MUST load to preserve user_id in URLs -->
    <script src="../Customer_assets/js/url_auth_helper.js"></script>
    
    <!-- Calendar Scheduler - Load BEFORE delivery tracking for cancelled order rescheduling -->
    <script src="../Customer_assets/js/calendar-scheduler.js"></script>
    
    <!-- Load Delivery Tracking -->
    <script src="../Customer_assets/js/load_delivery_tracking.js"></script>
    
    <!-- MATARIX NAVIGATION SYSTEM -->
    <script src="../Customer_assets/js/navigation.js"></script>
    
    <!-- Navigation Tracker - Handle origin-aware navigation -->
    <script src="../Customer_assets/js/navigation-tracker.js"></script>
    <script src="../Customer_assets/js/sidebar-navigation.js"></script>
    
    <!-- Customer Notifications System -->
    <script src="../Customer_assets/js/customer-notifications.js"></script>
    <script src="../Customer_assets/js/customer-notification-center.js"></script>
    
    <!-- Customer Notifications Modal -->
    <div class="modal fade" id="customerNotificationsModal" tabindex="-1" role="dialog" aria-labelledby="customerNotificationsModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="customerNotificationsModalLabel">
                        <i class="fas fa-bell mr-2"></i>Notifications
                    </h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body" style="max-height: 600px; overflow-y: auto;">
                    <div id="customerNotificationsLoading" class="text-center py-4">
                        <i class="fas fa-spinner fa-spin"></i>
                        <p class="text-muted mt-2">Loading notifications...</p>
                    </div>
                    <div id="customerNotificationsList" style="display: none;">
                        <!-- Notifications will be loaded here -->
                    </div>
                    <div id="customerNotificationsEmpty" class="text-center py-5" style="display: none;">
                        <i class="fas fa-inbox" style="font-size: 3rem; color: #ccc;"></i>
                        <p class="text-muted mt-3">No notifications yet</p>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" id="markAllCustomerReadBtn" style="display: none;">
                        <i class="fas fa-check-double mr-2"></i>Mark All as Read
                    </button>
                </div>
            </div>
        </div>
    </div>
    
</body>
</html>
