<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MATARIX - Order Summary</title>
    <!-- Google Fonts - Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 4 CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="../Customer_assets/css/OrderSummary.css" rel="stylesheet">
</head>
<body>
    <!-- HEADER NAVIGATION -->
    <nav class="navbar navbar-expand-lg matarix-header">
        <div class="container-fluid">
            <!-- LOGO PLACEHOLDER - Replace this img src with your actual logo -->
            <a class="navbar-brand" href="MainPage.html">
                <img src="../Customer_assets/images/LOGO.png" alt="MATARIX Logo" height="50" class="logo-img">
            </a>
            
            <!-- Mobile menu toggle button -->
            <button class="navbar-toggler d-lg-none" type="button" data-toggle="collapse" data-target="#mobileSearch">
                <i class="fas fa-search text-white"></i>
            </button>
            
            <!-- HEADER ICONS - Notifications, Cart, User -->
            <div class="ml-auto header-icons">
                <a href="notifications.html" class="navbar-icons" id="notificationIcon">
                    <i class="fas fa-bell"></i>
                </a>
                <a href="Cart.html" class="navbar-icons" id="cartIcon">
                    <i class="fas fa-shopping-cart"></i>
                </a>
                <a href="CustomerProfile.html" class="navbar-icons" id="userIcon">
                    <i class="fas fa-user"></i>
                </a>
                <!-- Mobile menu toggle for sidebar -->
                <button class="navbar-icons d-lg-none ml-2" id="sidebarToggle">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- SIDEBAR NAVIGATION -->
            <div class="sidebar" id="sidebar">
                <div class="sidebar-overlay d-lg-none" id="sidebarOverlay"></div>
                <div class="sidebar-content">
                    <!-- SIDEBAR MENU ITEMS -->
                    <a href="MainPage.html" class="sidebar-item" id="materialsLink">
                        <i class="fas fa-cubes"></i>Materials
                    </a>
                    <a href="OrderSummary.html" class="sidebar-item active" id="ordersLink">
                        <i class="fas fa-box"></i>Orders
                    </a>
                    <a href="delivery-tracking.html" class="sidebar-item" id="deliveriesLink">
                        <i class="fas fa-truck"></i>Deliveries
                    </a>
                </div>
            </div>

            <!-- MAIN CONTENT AREA -->
            <div class="main-content">
                <!-- ORDER SUMMARY HEADER -->
                <div class="order-header mb-4">
                    <div class="d-flex justify-content-between align-items-center flex-wrap">
                        <h1 class="order-title">Order Summary</h1>
                        <div class="order-details text-right">
                            <p class="mb-1 text-muted">Estimated Delivery</p>
                            <p class="mb-0 delivery-date">Loading...</p>
                            <p class="mb-0 delivery-time">Loading...</p>
                        </div>
                    </div>
                </div>

                <!-- Progress Tracker will be auto-generated by navigation.js here -->

                <!-- ORDER ITEMS TABLE -->
                <div class="order-table-container">
                    <div class="table-responsive">
                        <table class="table order-table mb-0">
                            <thead>
                                <tr>
                                    <th>Product Name</th>
                                    <th class="text-center">Quantity</th>
                                    <th class="text-center d-none d-md-table-cell">Variation</th>
                                    <th class="text-center d-none d-sm-table-cell">Price</th>
                                    <th class="text-center">Total</th>
                                </tr>
                            </thead>
                            <tbody id="orderItemsBody">
                                <!-- Order items will be loaded dynamically here -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- ORDER TOTAL SECTION -->
                <div class="order-total-section">
                    <div class="row justify-content-end">
                        <div class="col-md-4 col-sm-6">
                            <div class="total-amount">
                                <span class="total-label">Total:</span>
                                <span class="total-value" id="orderTotalValue">₱0.00</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- PAYMENT METHOD SECTION -->
                <div class="payment-info-section mt-4">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="payment-method-display">
                                <h6 class="payment-title">Paid thru: Loading...</h6>
                                <div class="gcash-info d-flex align-items-center" style="display: none;">
                                    <!-- GCASH LOGO PLACEHOLDER -->
                                    <img src="../Customer_assets/images/Gcash.png" alt="GCash" class="gcash-icon mr-3">
                                    <div class="payment-details">
                                        <p class="mb-1">
                                            <a href="#" class="receipt-link" id="viewReceiptLink">View Receipt</a>
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- TRACK ORDER BUTTON - UPDATED TO GO TO DELIVERY TRACKING -->
                <div class="action-section mt-4">
                    <div class="row justify-content-end">
                        <div class="col-md-3 col-sm-4">
                            <button class="btn btn-track-order" id="trackOrderBtn" onclick="window.location.href='payment.html'">
                                <i class="fas fa-map-marker-alt mr-2"></i>
                                Track Order
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 4 JS and dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Mobile sidebar toggle script -->
    <script>
        $(document).ready(function() {
            // SIDEBAR TOGGLE FUNCTIONALITY
            $('#sidebarToggle').click(function() {
                $('#sidebar').toggleClass('show');
                $('body').toggleClass('sidebar-open');
            });
            
            // SIDEBAR OVERLAY CLICK TO CLOSE
            $('#sidebarOverlay').click(function() {
                $('#sidebar').removeClass('show');
                $('body').removeClass('sidebar-open');
            });
            
            // CLOSE SIDEBAR ON WINDOW RESIZE IF LARGE SCREEN
            $(window).resize(function() {
                if ($(window).width() >= 992) {
                    $('#sidebar').removeClass('show');
                    $('body').removeClass('sidebar-open');
                }
            });

            // VIEW RECEIPT LINK - Now handled by direct href link with parameter
            // No need for click handler since we're using href="receipt.html?from=order-summary"
        });
    </script>
    
    <!-- Customer Authentication Check - MUST load first to verify session -->
    <script src="../Customer_assets/js/customer_auth_check.js"></script>
    
    <!-- URL Authentication Helper - MUST load to preserve user_id in URLs -->
    <script src="../Customer_assets/js/url_auth_helper.js"></script>
    
    <!-- Load Order Summary -->
    <script src="../Customer_assets/js/load_order_summary.js"></script>
    
    <!-- MATARIX NAVIGATION SYSTEM -->
    <script src="../Customer_assets/js/navigation.js"></script>
</body>
</html>
