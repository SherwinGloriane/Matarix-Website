<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form - MATARIX</title>
    <!-- Bootstrap 4 CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../Customer_assets/css/Registration.css">
    <style>
        #registrationMessage {
            margin-bottom: 15px;
            padding: 12px 15px;
            border-radius: 4px;
            font-size: 14px;
            text-align: center;
        }
        #registrationMessage.alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        #registrationMessage.alert-danger {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .required {
            color: #d32f2f;
        }
        .form-input:invalid {
            border-color: #dc3545;
        }
        .form-input:valid {
            border-color: #28a745;
        }
    </style>
</head>
<body>
    <!-- Background Container with Pattern Image -->
    <div class="background-container">
        
        <!-- Registration Form Container -->
        <div class="registration-container">
            
            <!-- Logo Section -->
            <div class="logo-section">
                <img src="../Customer_assets/images/MATARIX_logo.png" alt="Logo" class="logo-img">
            </div>

            <!-- Form Title -->
            <h1 class="form-title">REGISTRATION</h1>

            <!-- Registration Form -->
            <form class="registration-form" id="registrationForm">
                
                <!-- Error/Success Message -->
                <div id="registrationMessage" class="alert" style="display: none;"></div>
                
                <!-- First Row: Email (Full Width) -->
                <div class="form-row">
                    <div class="col-12">
                        <label class="form-label">Email <span class="required">*</span></label>
                        <input type="email" id="email" name="email" class="form-input" placeholder="Enter your Email" required>
                    </div>
                </div>

                <!-- Second Row: First Name and Last Name -->
                <div class="form-row row">
                    <div class="col-md-6">
                        <label class="form-label">First Name <span class="required">*</span></label>
                        <input type="text" id="first_name" name="first_name" class="form-input" placeholder="Enter your first name" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Last Name <span class="required">*</span></label>
                        <input type="text" id="last_name" name="last_name" class="form-input" placeholder="Enter your last name" required>
                    </div>
                </div>

                <!-- Third Row: Middle Name and Mobile Number -->
                <div class="form-row row">
                    <div class="col-md-6">
                        <label class="form-label">Middle Name (Optional)</label>
                        <input type="text" id="middle_name" name="middle_name" class="form-input" placeholder="Enter your middle name">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Mobile Number <span class="required">*</span></label>
                        <input type="tel" id="phone_number" name="phone_number" class="form-input" placeholder="Enter your mobile number" required>
                    </div>
                </div>

                <!-- Fourth Row: Password and Confirm Password -->
                <div class="form-row row">
                    <div class="col-md-6">
                        <label class="form-label">Password <span class="required">*</span></label>
                        <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password" required minlength="6">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Confirm Password <span class="required">*</span></label>
                        <input type="password" id="confirm_password" name="confirm_password" class="form-input" placeholder="Confirm Password" required>
                    </div>
                </div>

                <!-- Fifth Row: Address (Full Width) -->
                <div class="form-row">
                    <div class="col-12">
                        <label class="form-label">Address <span class="required">*</span></label>
                        <input type="text" id="address" name="address" class="form-input" placeholder="Enter your complete address" required>
                    </div>
                </div>
                
                <!-- Sign Up Button -->
                <button type="submit" class="signup-button" id="signupButton">Sign Up</button>  
                
                <!-- Login Link Section -->
                <div class="login-link-section">
                    <span class="login-text">Already have an Account? </span>
                    <a href="../Customer/Login.html" class="login-link">Login</a>
                </div>

                <!-- Terms of Service Link Section -->
                <div class="terms-link-section">
                    <a href="../Customer/TermsOfService.html" class="terms-link">Terms of Service</a>
                </div>

            </form>
        </div>
    </div>

    <!-- Bootstrap 4 JS and dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JavaScript -->
    <script src="../Customer_assets/js/Registration.js"></script>
</body>
</html>
