<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MATARIX - My Profile</title>
    <!-- Bootstrap 4 CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts - Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="../Customer_assets/css/CustomerProfile.css" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <nav class="navbar navbar-expand-lg matarix-header">
        <div class="container-fluid">
            <!-- Mobile menu toggle button -->
            <button class="navbar-toggler d-lg-none" type="button" id="sidebarToggle">
                <i class="fas fa-bars text-white"></i>
            </button>
            <!-- LOGO -->
            <a class="navbar-brand" href="MainPage.html">
                <img src="../Customer_assets/images/LOGO.png" alt="MATARIX Logo" height="50" class="logo-img d-none d-md-inline">
                <span class="d-md-none">MATARIX</span>
            </a>
            
            
            
            <!-- HEADER ICONS -->
            <div class="ml-auto header-icons">
                <a href="notifications.html" class="navbar-icons">
                    <i class="fas fa-bell"></i>
                </a>
                <a href="Cart.html" class="navbar-icons">
                    <i class="fas fa-shopping-cart"></i>
                </a>
                <a href="CustomerProfile.html" class="navbar-icons">
                    <i class="fas fa-user"></i>
                </a>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- SIDEBAR NAVIGATION -->
            <div class="sidebar" id="sidebar">
                <div class="sidebar-overlay d-lg-none" id="sidebarOverlay"></div>
                <div class="sidebar-content">
                    <a href="MainPage.html" class="sidebar-item">
                        <i class="fas fa-cubes"></i>Materials
                    </a>
                    <a href="OrderSummary.html" class="sidebar-item">
                        <i class="fas fa-box"></i>Orders
                    </a>
                    <a href="delivery-tracking.html" class="sidebar-item">
                        <i class="fas fa-truck"></i>Deliveries
                    </a>

                </div>
            </div>

            <!-- MAIN CONTENT AREA -->
            <div class="main-content">
                <!-- Profile Page -->
                <div class="page-header">
                    <div class="header-top">
                        <button class="btn btn-back" onclick="goBack()">
                            <i class="fas fa-arrow-left"></i> Back
                        </button>
                        <div class="header-info">
                            <h1 class="page-title">My Profile</h1>
                            <p class="page-subtitle">Manage your account settings</p>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <!-- Profile Picture Section -->
                    <div class="col-lg-4 col-md-6 mb-4">
                        <div class="profile-card">
                            <div class="profile-header">
                                <h5 class="card-title">Profile Picture</h5>
                            </div>
                            <div class="profile-picture-container">
                                <div class="profile-picture">
                                    <i class="fas fa-user"></i>
                                </div>
                                <button class="btn btn-upload" onclick="uploadPicture()">
                                    <i class="fas fa-camera"></i> Upload
                                </button>
                            </div>
                            <div class="profile-name">
                                <h6 id="profileDisplayName">Loading...</h6>
                                <p class="text-muted" id="profileDisplayRole">Customer</p>
                            </div>
                        </div>
                    </div>

                    <!-- Profile Information Section -->
                    <div class="col-lg-8 col-md-6 mb-4">
                        <div class="profile-card">
                            <div class="profile-header">
                                <h5 class="card-title">Profile Information</h5>
                            </div>
                            <form class="profile-form">
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="firstName" class="form-label">First Name</label>
                                        <input type="text" class="form-control profile-input" id="firstName" placeholder="Enter first name">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="lastName" class="form-label">Last Name</label>
                                        <input type="text" class="form-control profile-input" id="lastName" placeholder="Enter last name">
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="email" class="form-label">Email</label>
                                        <input type="email" class="form-control profile-input" id="email" placeholder="Enter email address">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="phone" class="form-label">Phone Number</label>
                                        <input type="tel" class="form-control profile-input" id="phone" placeholder="Enter phone number">
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label for="address" class="form-label">Address</label>
                                    <textarea class="form-control profile-input" id="address" rows="3" placeholder="Enter your address"></textarea>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="company" class="form-label">Company</label>
                                        <input type="text" class="form-control profile-input" id="company" placeholder="Enter company name">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="position" class="form-label">Position</label>
                                        <input type="text" class="form-control profile-input" id="position" placeholder="Enter your position">
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Security Settings Section -->
                <div class="row">
                    <div class="col-lg-6 mb-4">
                        <div class="profile-card">
                            <div class="profile-header">
                                <h5 class="card-title">Security Settings</h5>
                            </div>
                            <div class="security-section">
                                <div class="security-item">
                                    <div class="security-info">
                                        <h6>Change Password</h6>
                                        <p class="text-muted">Update your password for better security</p>
                                    </div>
                                    <button class="btn btn-outline-primary btn-sm" onclick="changePassword()">
                                        <i class="fas fa-key"></i> Change
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Preferences Section -->
                    <div class="col-lg-6 mb-4">
                        <div class="profile-card">
                            <div class="profile-header">
                                <h5 class="card-title">Preferences</h5>
                            </div>
                            <div class="preferences-section">
                                <div class="preference-item">
                                    <div class="preference-info">
                                        <h6>SMS Notifications</h6>
                                        <p class="text-muted">Receive delivery updates via SMS</p>
                                    </div>
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" id="smsNotifs">
                                        <label class="form-check-label" for="smsNotifs">Enable</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="row">
                    <div class="col-12">
                        <div class="profile-actions">
                            <button class="btn btn-custom" onclick="saveProfile()">
                                <i class="fas fa-save"></i> Save Changes
                            </button>
                            <button class="btn btn-secondary ml-2" onclick="cancelChanges()">
                                <i class="fas fa-times"></i> Cancel
                            </button>
                            <button class="btn btn-danger ml-auto" onclick="logout()">
                                <i class="fas fa-sign-out-alt"></i> Logout
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Load user profile data
        function loadUserProfile() {
            // First try to get from sessionStorage (quick access)
            const userId = sessionStorage.getItem('user_id');
            const userEmail = sessionStorage.getItem('user_email');
            const userName = sessionStorage.getItem('user_name');
            const userRole = sessionStorage.getItem('user_role');
            
            // If we have basic data, use it temporarily while fetching full profile
            if (userName) {
                document.getElementById('profileDisplayName').textContent = userName;
            }
            if (userRole) {
                document.getElementById('profileDisplayRole').textContent = userRole;
            }
            
            // Fetch full profile data from API
            fetch('../api/get_profile.php', {
                method: 'GET',
                credentials: 'include' // Include cookies for session
            })
            .then(response => response.json())
            .then(data => {
                if (data.success && data.user) {
                    const user = data.user;
                    
                    // Populate form fields
                    document.getElementById('firstName').value = user.first_name || '';
                    document.getElementById('lastName').value = user.last_name || '';
                    document.getElementById('email').value = user.email || '';
                    document.getElementById('phone').value = user.phone_number || '';
                    document.getElementById('address').value = user.address || '';
                    
                    // Update profile name display
                    const fullName = user.full_name || (user.first_name + ' ' + user.last_name).trim() || 'User';
                    document.getElementById('profileDisplayName').textContent = fullName || 'User';
                    
                    // Update role display
                    if (user.role) {
                        document.getElementById('profileDisplayRole').textContent = user.role;
                    }
                    
                    console.log('Profile data loaded successfully');
                } else {
                    console.error('Failed to load profile:', data.message);
                    // Fallback to sessionStorage data
                    if (userName) {
                        document.getElementById('profileDisplayName').textContent = userName;
                    }
                }
            })
            .catch(error => {
                console.error('Error loading profile:', error);
                // Fallback to sessionStorage data
                if (userName) {
                    document.getElementById('profileDisplayName').textContent = userName;
                }
                if (userEmail) {
                    document.getElementById('email').value = userEmail;
                }
            });
        }
        
        // Load profile data when page loads
        document.addEventListener('DOMContentLoaded', function() {
            loadUserProfile();
        });
        
        // Toggle sidebar for mobile
        document.getElementById('sidebarToggle').addEventListener('click', function() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('show');
            overlay.classList.toggle('show');
        });

        // Close sidebar when clicking overlay
        document.getElementById('sidebarOverlay').addEventListener('click', function() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.remove('show');
            overlay.classList.remove('show');
        });

        // Back button functionality
        function goBack() {
            // Check if there's history to go back to
            if (window.history.length > 1) {
                window.history.back();
            } else {
                // If no history, go to landing page as default
                window.location.href = 'MainPage.html';
            }
        }

        // Profile functions
        function uploadPicture() {
            // Create file input
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        // Update profile picture (in real app, this would upload to server)
                        alert('Profile picture uploaded successfully!');
                    };
                    reader.readAsDataURL(file);
                }
            };
            input.click();
        }

        function changePassword() {
            alert('Change password functionality would open a modal or redirect to password change page.');
        }

        function saveProfile() {
            // Collect form data
            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const address = document.getElementById('address').value;
            const company = document.getElementById('company').value;
            const position = document.getElementById('position').value;
            
            // In real app, this would send data to server
            alert('Profile updated successfully!');
        }

        function cancelChanges() {
            // Reset form to original values by reloading profile data
            loadUserProfile();
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                // Clear sessionStorage
                sessionStorage.clear();
                // Redirect to login page
                window.location.href = 'Login.html';
            }
        }
    </script>
</body>
</html>
