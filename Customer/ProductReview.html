<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MATARIX - Review Products</title>
    <!-- Bootstrap 4 CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts - Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="../Customer_assets/css/ProductReview.css" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <nav class="navbar navbar-expand-lg matarix-header">
        <div class="container-fluid">
            <!-- Mobile menu toggle button -->
            <button class="navbar-toggler d-lg-none" type="button" id="sidebarToggle">
                <i class="fas fa-bars text-white"></i>
            </button>
            <!-- LOGO -->
            <a class="navbar-brand" href="MainPage.html">
                <img src="../Customer_assets/images/LOGO.png" alt="MATARIX Logo" height="50" class="logo-img d-none d-md-inline">
                <span class="d-md-none">MATARIX</span>
            </a>
            
           
            
            <!-- HEADER ICONS -->
            <div class="ml-auto header-icons">
                <a href="notifications.html" class="navbar-icons">
                    <i class="fas fa-bell"></i>
                </a>
                <a href="Cart.html" class="navbar-icons">
                    <i class="fas fa-shopping-cart"></i>
                </a>
                <a href="CustomerProfile.html" class="navbar-icons">
                    <i class="fas fa-user"></i>
                </a>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- SIDEBAR NAVIGATION -->
            <div class="sidebar" id="sidebar">
                <div class="sidebar-overlay d-lg-none" id="sidebarOverlay"></div>
                <div class="sidebar-content">
                    <a href="#" class="sidebar-item" id="materialsLink">
                        <i class="fas fa-cubes"></i>Materials
                    </a>
                    <a href="OrderSummary.html" class="sidebar-item">
                        <i class="fas fa-box"></i>Orders
                    </a>
                    <a href="delivery-tracking.html" class="sidebar-item active">
                        <i class="fas fa-truck"></i>Deliveries
                    </a>
                    
                   
                </div>
            </div>

            <!-- MAIN CONTENT AREA -->
            <div class="main-content">
                <!-- Review Products Page -->
                <div class="page-header">
                    <button class="btn-back" onclick="goBackToDeliveries()">
                        <i class="fas fa-arrow-left"></i> Back to Deliveries
                    </button>
                    <h1 class="page-title">Review Products</h1>
                </div>

                <!-- Progress Tracker will be auto-generated by navigation.js -->

                <!-- Review Card - Will be populated dynamically -->
                <div class="review-card">
                    <div class="order-item">
                        <div class="item-details" style="width: 100%; text-align: center; padding: 40px;">
                            <div class="item-name" style="color: var(--matarix-text-muted);">
                                <i class="fas fa-spinner fa-spin" style="font-size: 2rem; margin-bottom: 20px; display: block;"></i>
                                Loading order details...
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Individual Item Reviews - Will be populated dynamically -->
                <div class="item-reviews-section">
                    <h6 class="section-title">Rate Individual Items</h6>
                    <div class="text-center py-3 text-muted">Loading items...</div>
                </div>

                <!-- Submit Review Button -->
                <div class="review-actions">
                    <button class="btn btn-submit-review" onclick="submitReview()">Submit Review</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Overall Feedback Modal -->
    <div class="modal fade" id="feedbackModal" tabindex="-1" role="dialog">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Write Overall Feedback</h5>
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="feedbackText">Your Feedback:</label>
                        <textarea class="form-control" id="feedbackText" rows="4" placeholder="Share your experience with this order..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>Overall Rating:</label>
                        <div class="star-rating modal-rating" id="modalRating">
                            <span class="star" data-rating="1">★</span>
                            <span class="star" data-rating="2">★</span>
                            <span class="star" data-rating="3">★</span>
                            <span class="star" data-rating="4">★</span>
                            <span class="star" data-rating="5">★</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="anonymousFeedback" value="1">
                            <label class="form-check-label" for="anonymousFeedback">
                                <i class="fas fa-user-secret"></i> Submit as Anonymous
                            </label>
                            <small class="form-text text-muted d-block">Your name will not be shown in the feedback</small>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-custom" onclick="saveFeedback()">Save Feedback</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Item Feedback Modal -->
    <div class="modal fade" id="itemFeedbackModal" tabindex="-1" role="dialog">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="itemFeedbackModalTitle">Write Item Feedback</h5>
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="itemFeedbackText">Your Feedback:</label>
                        <textarea class="form-control" id="itemFeedbackText" rows="4" placeholder="Share your experience with this product..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>Product Rating:</label>
                        <div class="star-rating modal-rating" id="itemFeedbackModalRating">
                            <span class="star" data-rating="1">★</span>
                            <span class="star" data-rating="2">★</span>
                            <span class="star" data-rating="3">★</span>
                            <span class="star" data-rating="4">★</span>
                            <span class="star" data-rating="5">★</span>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-custom" onclick="saveItemFeedback()">Save Feedback</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 4 JS and dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        $(document).ready(function() {
            // SIDEBAR TOGGLE FUNCTIONALITY
            $('#sidebarToggle').click(function() {
                $('#sidebar').toggleClass('show');
                $('body').toggleClass('sidebar-open');
            });
            
            // SIDEBAR OVERLAY CLICK TO CLOSE
            $('#sidebarOverlay').click(function() {
                $('#sidebar').removeClass('show');
                $('body').removeClass('sidebar-open');
            });
            
            // CLOSE SIDEBAR ON WINDOW RESIZE IF LARGE SCREEN
            $(window).resize(function() {
                if ($(window).width() >= 992) {
                    $('#sidebar').removeClass('show');
                    $('body').removeClass('sidebar-open');
                }
            });
            
            // Initialize modal star ratings
            $('#modalRating .star').on('click', function() {
                const rating = parseInt($(this).data('rating'));
                const container = $(this).parent();
                container.find('.star').each(function(index) {
                    if (index < rating) {
                        $(this).addClass('filled');
                    } else {
                        $(this).removeClass('filled');
                    }
                });
            });
            
            $('#itemFeedbackModalRating .star').on('click', function() {
                const rating = parseInt($(this).data('rating'));
                const container = $(this).parent();
                container.find('.star').each(function(index) {
                    if (index < rating) {
                        $(this).addClass('filled');
                    } else {
                        $(this).removeClass('filled');
                    }
                });
            });
        });

        // Close sidebar when clicking outside on mobile
        document.addEventListener('click', function(event) {
            const sidebar = document.getElementById('sidebar');
            const toggle = document.querySelector('#sidebarToggle');
            
            if (!sidebar.contains(event.target) && !toggle.contains(event.target)) {
                sidebar.classList.remove('show');
                document.querySelector('#sidebarOverlay').classList.remove('show');
            }
        });
    </script>
    
    <!-- Customer Authentication Check - MUST load first to verify session -->
    <script src="../Customer_assets/js/customer_auth_check.js"></script>
    
    <!-- URL Authentication Helper - MUST load to preserve user_id in URLs -->
    <script src="../Customer_assets/js/url_auth_helper.js"></script>
    
    <!-- Navigation Tracker - Handle origin-aware navigation -->
    <script src="../Customer_assets/js/navigation-tracker.js"></script>
    <script src="../Customer_assets/js/sidebar-navigation.js"></script>
    
    <!-- Load Product Review - Load before navigation.js -->
    <script src="../Customer_assets/js/load_product_review.js"></script>
    
    <!-- MATARIX NAVIGATION SYSTEM -->
    <script src="../Customer_assets/js/navigation.js"></script>
</body>
</html>
