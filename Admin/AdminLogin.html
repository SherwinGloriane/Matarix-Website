<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - MATARIX</title>
    <!-- Bootstrap 4 CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../Admin_assets/css/AdminLogin.css">
    <style>
        #loginMessage {
            margin-bottom: 15px;
            padding: 12px 15px;
            border-radius: 4px;
            font-size: 14px;
            text-align: center;
        }
        #loginMessage.alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        #loginMessage.alert-danger {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>

<body>
    <!-- Background Container with Same Pattern Image -->
    <div class="background-container">
        
        <!-- Main Container with Two White Rectangles -->
        <div class="login-container">
            
            <!-- Left White Rectangle - Form Section -->
            <div class="left-rectangle">
                
                <!-- Logo Section -->
                <div class="logo-section">
                    <img src="../Admin_assets/images/logo.png" alt="Logo Icon" class="logo-icon">
                </div>

                <!-- Login Form -->
                <form class="login-form" id="adminLoginForm">
                    
                    <!-- Error/Success Message -->
                    <div id="loginMessage" class="alert" style="display: none;"></div>
                    
                    <!-- Username/Email Input Field with Icon -->
                    <div class="form-group">
                        <div class="input-with-icon">
                            <i class="fas fa-user input-icon"></i>
                            <input type="email" id="email" name="email" class="form-input" placeholder="Email" required>
                        </div>
                    </div>

                    <!-- Password Input Field with Icon -->
                    <div class="form-group">
                        <div class="input-with-icon">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="password" name="password" class="form-input" placeholder="Password" required>
                        </div>
                    </div>
                    
                    <!-- Forgot Password Link -->
                    <div class="forgot-password-section">
                        <a href="../Admin/ForgotPassword.html" class="forgot-password-link">Forgot Password?</a>
                    </div>

                    <!-- Login Button -->
                    <button type="submit" class="login-button" id="loginButton">LOGIN</button>

                    <!-- Sign Up Link Section -->
                    <div class="signup-link-section">
                        <a href="../Admin/AdminRegistration.html" class="signup-link">Sign up for an account</a>
                    </div>

                </form>
            </div>

            <!-- Right White Rectangle - Image Section -->
            <div class="right-rectangle">
                <!-- This section will be covered with your background image -->
            </div>
        </div>
    </div>

    <!-- Bootstrap 4 JS and dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JavaScript -->
    <script src="../Admin_assets/js/AdminLogin.js"></script>
</body>
</html>
